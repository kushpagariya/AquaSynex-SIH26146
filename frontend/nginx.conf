server {
    listen 80;
    server_name localhost;

    # Allow large CSV dataset uploads (matching backend MAX_UPLOAD_SIZE_BYTES: 2GB)
    client_max_body_size 2048M;

    # Reverse proxy API requests to the FastAPI backend service
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # Forward original request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Extended timeouts for long-running ML analysis pipelines
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Serve React SPA static build
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Fall back to index.html for React Router client-side routing
        try_files $uri $uri/ /index.html;
    }

    # Standard error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
